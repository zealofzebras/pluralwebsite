<!doctype html>
<html lang="{{ site.Language.Locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7f5">
    <title>{{ if .IsHome }}Plural | Every voice. One take.{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    <meta name="description" content="{{ .Description | default site.Params.description }}">
    <link rel="canonical" href="{{ .Permalink }}">
    <meta property="og:title" content="{{ if .IsHome }}Plural | Every voice. One take.{{ else }}{{ .Title }} | Plural{{ end }}">
    <meta property="og:description" content="{{ .Description | default site.Params.description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:image" content="{{ "images/recorder.png" | absURL }}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/svg+xml" href="{{ "images/plural.svg" | relURL }}">
    <link rel="icon" sizes="32x32" type="image/png" href="{{ "favicon-32.png" | relURL }}">
    <link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
    <link rel="preload" href="{{ "fonts/space-grotesk.ttf" | relURL }}" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header wrap">
      <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="Plural home"><img src="{{ "images/plural.svg" | relURL }}" width="36" height="36" alt="">Plural<span class="brand-dot">.</span></a>
      <nav aria-label="Main navigation">
        <a class="nav-feature" href="{{ site.Home.RelPermalink }}#possibilities">Explore</a>
        <a href="{{ "support/" | relURL }}">Support</a>
        <a class="button button-small" href="{{ site.Home.RelPermalink }}#download">Get Plural <span aria-hidden="true">&#8599;</span></a>
      </nav>
    </header>
    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer wrap">
      <div><a class="brand" href="{{ site.Home.RelPermalink }}"><img src="{{ "images/plural.svg" | relURL }}" width="28" height="28" alt="">Plural<span class="brand-dot">.</span></a><p>A little more room for every voice.</p></div>
      <nav aria-label="Footer navigation"><a href="{{ "support/" | relURL }}">Support</a><a href="{{ "privacy/" | relURL }}">Privacy</a><a href="https://github.com/zealofzebras/plural">Open source <span aria-hidden="true">&#8599;</span></a></nav>
      <p class="disclaimer">Independent of Sabinetek. SmartMike is a trademark of its owner.<br>&copy; {{ now.Year }} Plural · getplural.net</p>
    </footer>
  </body>
</html>
